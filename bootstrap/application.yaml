apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-lab
  namespace: argocd
spec:
  project: gitops-lab
  source:
    repoURL: https://github.com/jgerchev/gitops-lab
    targetRevision: main
    path: gitops
    # No directory.source or kustomize override: Argo detects either format.
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
